[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repograph"
version = "0.1.0"
description = "Local-first codebase intelligence engine with CLI, SQLite indexing, and React UI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Malay Chhatbar" }
]
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn>=0.35,<1.0",
  "pydantic>=2.11,<3.0",
  "typer>=0.16,<1.0",
  "rich>=14.1,<15.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
]

[project.scripts]
repograph = "repograph.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/repograph"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

